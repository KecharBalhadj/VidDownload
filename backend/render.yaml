services:
  - type: web
    name: vidget-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vidget-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: 0
      - key: FRONTEND_URL
        value: https://vidget.app
      - key: ADMIN_URL
        value: https://admin.vidget.app

databases:
  - name: vidget-db
    databaseName: vidget
    user: vidget
